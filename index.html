<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Crypto</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f5fb;--card:#fff;--text:#171a23;--muted:#7b8194;--line:#e8ebf3;--ac:#6c5ce7;--ac2:#8e7cf8;--soft:rgba(108,92,231,.12);--up:#22c08a;--down:#ef5b6b;--sh:0 6px 24px rgba(30,40,90,.08)}
:root[data-theme=dark]{--bg:#0f1117;--card:#1a1d27;--text:#eef0f6;--muted:#8c93a8;--line:#272b38;--ac:#8b7bff;--ac2:#a89bff;--soft:rgba(139,123,255,.16);--sh:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
button,input,select{font-family:inherit;font-size:16px;color:var(--text)}
.app{max-width:560px;margin:0 auto;padding:16px 14px calc(92px + env(safe-area-inset-bottom))}
.screen{display:none;animation:f .25s}.screen.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{margin:4px 0 12px;font-size:22px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.in{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none}
.in:focus{border-color:var(--ac)}
.btn{border:0;cursor:pointer;font-weight:600;border-radius:12px;padding:11px 16px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.btn.g{background:var(--soft);color:var(--ac)}.btn.r{background:rgba(239,91,107,.12);color:var(--down)}
.btn:active{opacity:.85}.blk{display:block;width:100%;margin-top:10px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
.coin{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.coin:last-child{border:0}.coin b{font-size:16px}
.ico{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.r1{text-align:right}.up{color:var(--up)}.down{color:var(--down)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent)}
.tabs div{display:flex;width:100%;max-width:560px;background:var(--card);border-radius:20px;padding:5px;box-shadow:var(--sh)}
.tab{flex:1;border:0;background:none;color:var(--muted);padding:6px 2px;border-radius:15px;font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab i{font-style:normal;font-size:20px}.tab.on{background:var(--soft);color:var(--ac);font-weight:700}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
canvas{width:100%;height:190px;display:block;touch-action:none}
.big{font-size:28px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#222633;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;text-align:center;transition:.25s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="app">

<section id="s-market" class="screen on">
  <h2 data-i="market"></h2>
  <div class="row" style="margin-bottom:12px"><input id="q" class="in" data-p="search_ph" maxlength="12"><button id="qb" class="btn">🔎</button></div>
  <div class="card" id="coins"></div>
</section>

<section id="s-fx" class="screen">
  <h2 data-i="fx"></h2>
  <div class="card">
    <div class="muted" data-i="converter"></div>
    <div class="row" style="margin-top:8px"><input id="amt" class="in" type="number" inputmode="decimal" value="100"><select id="from" class="in" style="width:110px"></select></div>
    <div class="row" style="margin-top:8px"><button id="swap" class="btn g">⇅</button><select id="to" class="in"></select></div>
    <div class="big" id="res" style="margin-top:12px"></div>
  </div>
  <div class="card"><div class="muted" id="ratesHead"></div><div id="rates"></div></div>
</section>

<section id="s-world" class="screen">
  <h2 data-i="world"></h2>
  <div class="seg" id="wseg"><button data-w="weather" class="on" data-i="weather"></button><button data-w="time" data-i="time"></button></div>
  <div id="w-weather">
    <div class="row"><input id="city" class="in" data-p="city_ph" maxlength="60"><button id="cityb" class="btn">🔎</button></div>
    <div class="card" id="wout" style="margin-top:12px"></div>
  </div>
  <div id="w-time" style="display:none">
    <div class="row"><input id="tcity" class="in" data-p="city_ph" maxlength="60"><button id="tcityb" class="btn">＋</button></div>
    <div class="card" id="clocks" style="margin-top:12px"></div>
  </div>
</section>

<section id="s-track" class="screen">
  <h2 data-i="tracker"></h2>
  <div class="card">
    <div class="muted" data-i="track_note"></div>
    <input id="asym" class="in" data-p="sym_ph" maxlength="12" style="margin-top:10px">
    <div class="row" style="margin-top:8px">
      <select id="adir" class="in" style="width:80px"><option value=">">&gt;</option><option value="<">&lt;</option></select>
      <input id="atg" class="in" type="number" inputmode="decimal" data-p="target">
      <select id="acur" class="in" style="width:92px"></select>
    </div>
    <button id="asend" class="btn blk" data-i="send_bot"></button>
  </div>
  <div class="card"><div class="muted" data-i="watch"></div><div id="watch"></div></div>
</section>

<section id="s-me" class="screen">
  <h2 data-i="profile"></h2>
  <div class="card row"><div class="ico" id="av" style="width:52px;height:52px;font-size:20px"></div><div class="sp"><b id="uname"></b><div class="muted" id="uinfo"></div></div></div>
  <div class="card">
    <div class="muted" data-i="language"></div><div class="seg" id="lseg"><button data-l="ru">Русский</button><button data-l="en">English</button></div>
    <div class="muted" data-i="currency"></div><select id="cursel" class="in" style="margin:8px 0 12px"></select>
    <div class="muted" data-i="theme"></div><div class="seg" id="tseg"><button data-t="auto" data-i="auto"></button><button data-t="light" data-i="light"></button><button data-t="dark" data-i="dark"></button></div>
  </div>
  <button id="close" class="btn g blk" data-i="close"></button>
  <button id="reset" class="btn r blk" data-i="reset"></button>
</section>

</div>

<div id="sheet"><div class="panel">
  <div class="row"><b id="dsym" style="font-size:20px"></b><span class="sp"></span><button class="x" id="dclose">✕</button></div>
  <div class="big" id="dprice"></div><div id="dchg"></div>
  <div class="seg" id="pseg"><button data-p="1D">1D</button><button data-p="7D" class="on">7D</button><button data-p="30D">30D</button><button data-p="1Y">1Y</button></div>
  <canvas id="cv"></canvas><div class="muted" id="cinfo" style="min-height:18px;margin-top:4px"></div>
  <div class="grid" id="dstats"></div>
  <div class="row" style="margin-top:12px"><button id="dstar" class="btn g sp"></button><button id="dalert" class="btn sp" data-i="mk_alert"></button></div>
</div></div>

<div class="toast" id="toast"></div>
<nav class="tabs"><div>
  <button class="tab on" data-tab="market"><i>💹</i><span data-i="market"></span></button>
  <button class="tab" data-tab="fx"><i>💱</i><span data-i="fx"></span></button>
  <button class="tab" data-tab="world"><i>🌍</i><span data-i="world"></span></button>
  <button class="tab" data-tab="track"><i>🔔</i><span data-i="tracker"></span></button>
  <button class="tab" data-tab="me"><i>👤</i><span data-i="profile"></span></button>
</div></nav>

<script>
(function(){
"use strict";
var tg=window.Telegram&&window.Telegram.WebApp||null;
var qp=new URLSearchParams(location.search);
var TOP=["BTC","ETH","TON","SOL","BNB","XRP","DOGE","TRX","ADA","AVAX"];
var FIATS=["USD","EUR","RUB","UAH","KZT","GBP","CNY","TRY"];
var CLOCKS=[{n:{ru:"Москва",en:"Moscow"},tz:"Europe/Moscow"},{n:{ru:"Лондон",en:"London"},tz:"Europe/London"},{n:{ru:"Нью-Йорк",en:"New York"},tz:"America/New_York"},{n:{ru:"Дубай",en:"Dubai"},tz:"Asia/Dubai"},{n:{ru:"Токио",en:"Tokyo"},tz:"Asia/Tokyo"}];
var HOSTS=["https://api.binance.com","https://data-api.binance.vision"];
var PER={"1D":["15m",96],"7D":["1h",168],"30D":["4h",180],"1Y":["1d",365]};
var L={
ru:{market:"Рынок",fx:"Валюты",world:"Мир",tracker:"Трекер",profile:"Профиль",search_ph:"Монета: BTC, TON…",converter:"Конвертер валют",weather:"Погода",time:"Время",city_ph:"Город",track_note:"Оповещение придёт в чат с ботом. Список оповещений: «🔔 Трекер» в боте.",sym_ph:"BTC или USD/RUB",target:"Цена",send_bot:"Создать оповещение в боте",watch:"Избранные монеты",language:"Язык",currency:"Валюта цен",theme:"Тема",auto:"Авто",light:"Светлая",dark:"Тёмная",close:"Закрыть приложение",reset:"Сбросить данные",mk_alert:"🔔 Оповещение",err:"Не удалось загрузить данные",nf:"Не найдено",high:"Макс 24ч",low:"Мин 24ч",vol:"Объём 24ч",rate_for:"Курсы к ",feels:"ощущается",hum:"Влажность",wind:"Ветер",empty:"Пусто — добавь монету звёздочкой ☆",sent:"Не получилось. Откройте приложение кнопкой «🚀 Открыть приложение» в чате с ботом",sure:"Сбросить все данные?",star:"☆ В избранное",unstar:"★ Убрать",guest:"Гость"},
en:{market:"Market",fx:"Currencies",world:"World",tracker:"Tracker",profile:"Profile",search_ph:"Coin: BTC, TON…",converter:"Currency converter",weather:"Weather",time:"Time",city_ph:"City",track_note:"The alert will arrive in the bot chat. Your alerts list: “🔔 Tracker” in the bot.",sym_ph:"BTC or USD/RUB",target:"Price",send_bot:"Create alert in the bot",watch:"Favorite coins",language:"Language",currency:"Price currency",theme:"Theme",auto:"Auto",light:"Light",dark:"Dark",close:"Close app",reset:"Reset data",mk_alert:"🔔 Alert",err:"Could not load data",nf:"Not found",high:"24h high",low:"24h low",vol:"24h volume",rate_for:"Rates for ",feels:"feels like",hum:"Humidity",wind:"Wind",empty:"Empty — add a coin with the star ☆",sent:"Failed. Open the app with the “🚀 Open app” button in the bot chat",sure:"Reset all data?",star:"☆ Favorite",unstar:"★ Remove",guest:"Guest"}
};
var KEY="cryptoapp_v1";
var S={lang:"",cur:"USD",theme:"auto",watch:[],clocks:[],city:""};
var sv={};try{sv=JSON.parse(localStorage.getItem(KEY)||"{}")||{};for(var k in sv)if(k in S)S[k]=sv[k]}catch(e){}
var user=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user||null;
if(!user&&/^[0-9]{1,15}$/.test(qp.get("id")||"")){user={id:Number(qp.get("id")),first_name:(qp.get("fn")||"").slice(0,64),username:(qp.get("un")||"").slice(0,64),language_code:(qp.get("lang")||"").slice(0,10)}}
if(!S.lang){var lc=(qp.get("lang")||(user&&user.language_code)||navigator.language||"en").slice(0,2);S.lang=["ru","uk","be","kk"].indexOf(lc)>=0?"ru":"en"}
if(["ru","en"].indexOf(qp.get("lang"))>=0&&!sv.lang)S.lang=qp.get("lang");
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function t(k){return L[S.lang][k]||k}
function loc(){return S.lang==="ru"?"ru-RU":"en-US"}
var tt;function toast(m){var e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},2600)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

/* ---------- сеть ---------- */
async function bn(path){var err;for(var i=0;i<HOSTS.length;i++){try{var r=await fetch(HOSTS[i]+path);if(r.status===400)throw new Error("bad");if(!r.ok)throw new Error(r.status);return await r.json()}catch(x){err=x;if(x.message==="bad")break}}throw err}
async function jget(u){var r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
var fxc=null;
async function rates(){if(fxc&&Date.now()-fxc.t<18e5)return fxc.r;var d=await jget("https://open.er-api.com/v6/latest/USD");fxc={t:Date.now(),r:d.rates};return fxc.r}
async function rate(c){if(c==="USD")return 1;try{return(await rates())[c]||1}catch(e){return 1}}
function money(v,c){var d=Math.abs(v)>=1?2:Math.abs(v)>=.01?4:8;try{return new Intl.NumberFormat(loc(),{style:"currency",currency:c,maximumFractionDigits:d,minimumFractionDigits:Math.abs(v)>=1?2:0}).format(v)}catch(e){return v.toFixed(d)+" "+c}}
function pct(v){return(v>=0?"+":"")+v.toFixed(2)+"%"}

/* ---------- язык ---------- */
function applyI18n(){
 document.documentElement.lang=S.lang;
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.getAttribute("data-i"))});
 document.querySelectorAll("[data-p]").forEach(function(e){if(e.tagName==="INPUT")e.placeholder=t(e.getAttribute("data-p"))});
 document.querySelectorAll("#lseg button").forEach(function(b){b.classList.toggle("on",b.dataset.l===S.lang)});
 document.querySelectorAll("#tseg button").forEach(function(b){b.classList.toggle("on",b.dataset.t===S.theme)});
}
function applyTheme(){
 var m=S.theme;if(m==="auto")m=tg&&tg.colorScheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
 document.documentElement.setAttribute("data-theme",m);
 try{var bg=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();tg&&(tg.setHeaderColor(bg),tg.setBackgroundColor(bg))}catch(e){}
}

/* ---------- рынок ---------- */
function list(){var a=S.watch.concat(TOP.filter(function(s){return S.watch.indexOf(s)<0}));return a}
async function loadMarket(){
 var box=$("coins");
 try{
  var syms=list(),k=await rate(S.cur);
  var data=await bn("/api/v3/ticker/24hr?symbols="+encodeURIComponent(JSON.stringify(syms.map(function(s){return s+"USDT"}))));
  var by={};data.forEach(function(d){by[d.symbol.slice(0,-4)]=d});
  box.textContent="";
  syms.forEach(function(s){var d=by[s];if(!d)return;
   var ch=parseFloat(d.priceChangePercent),r=el("div","coin");
   r.appendChild(el("div","ico",s.slice(0,4)));
   var m=el("div","sp");m.appendChild(el("b","",(S.watch.indexOf(s)>=0?"★ ":"")+s));
   r.appendChild(m);
   var p=el("div","r1");p.appendChild(el("b","",money(parseFloat(d.lastPrice)*k,S.cur)));
   p.appendChild(el("div",ch>=0?"up":"down",pct(ch)));r.appendChild(p);
   r.onclick=function(){openCoin(s)};box.appendChild(r)});
 }catch(e){box.textContent=t("err")}
}

/* ---------- карточка монеты и график ---------- */
var cur={sym:"",per:"7D",pts:[],k:1};
async function openCoin(sym){
 sym=sym.toUpperCase().replace(/[^A-Z0-9]/g,"");if(!sym)return;
 try{
  var d=await bn("/api/v3/ticker/24hr?symbol="+sym+"USDT");
  cur.sym=sym;cur.k=await rate(S.cur);var ch=parseFloat(d.priceChangePercent);
  $("dsym").textContent=sym+" / "+S.cur;$("dprice").textContent=money(parseFloat(d.lastPrice)*cur.k,S.cur);
  var c=$("dchg");c.textContent=pct(ch);c.className=ch>=0?"up":"down";
  var st=$("dstats");st.textContent="";
  [[t("high"),money(parseFloat(d.highPrice)*cur.k,S.cur)],[t("low"),money(parseFloat(d.lowPrice)*cur.k,S.cur)],[t("vol"),new Intl.NumberFormat(loc(),{notation:"compact"}).format(parseFloat(d.quoteVolume)*cur.k)+" "+S.cur]].forEach(function(x){var b=el("div","card");b.style.margin=0;b.appendChild(el("div","muted",x[0]));b.appendChild(el("b","",x[1]));st.appendChild(b)});
  starBtn();$("sheet").classList.add("on");loadChart()
 }catch(e){toast(e&&e.message==="bad"?t("nf"):t("err"))}
}
function starBtn(){$("dstar").textContent=S.watch.indexOf(cur.sym)>=0?t("unstar"):t("star")}
async function loadChart(){
 var p=PER[cur.per];
 try{var ks=await bn("/api/v3/klines?symbol="+cur.sym+"USDT&interval="+p[0]+"&limit="+p[1]);
  cur.pts=ks.map(function(x){return[x[0],parseFloat(x[4])*cur.k]});draw(-1)}catch(e){toast(t("err"))}
}
function draw(hi){
 var cv=$("cv"),pts=cur.pts;if(pts.length<2)return;
 var dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
 var c=cv.getContext("2d");c.scale(dpr,dpr);
 var ys=pts.map(function(p){return p[1]}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),up=ys[ys.length-1]>=ys[0];
 var col=up?"#22c08a":"#ef5b6b",X=function(i){return i/(pts.length-1)*w},Y=function(v){return h-8-(v-mn)/((mx-mn)||1)*(h-16)};
 var g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,col+"55");g.addColorStop(1,col+"00");
 c.beginPath();pts.forEach(function(p,i){i?c.lineTo(X(i),Y(p[1])):c.moveTo(X(i),Y(p[1]))});
 c.strokeStyle=col;c.lineWidth=2;c.lineJoin="round";c.stroke();
 c.lineTo(w,h);c.lineTo(0,h);c.closePath();c.fillStyle=g;c.fill();
 if(hi>=0){c.beginPath();c.arc(X(hi),Y(pts[hi][1]),5,0,7);c.fillStyle=col;c.fill();
  $("cinfo").textContent=money(pts[hi][1],S.cur)+" · "+new Date(pts[hi][0]).toLocaleString(loc(),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
 else $("cinfo").textContent=money(mn,S.cur)+" … "+money(mx,S.cur);
}

/* ---------- валюты ---------- */
function fillSel(id,val){var s=$(id);s.textContent="";FIATS.forEach(function(c){var o=el("option","",c);o.value=c;s.appendChild(o)});s.value=val}
async function loadFx(){
 try{var r=await rates(),a=parseFloat($("amt").value)||0,f=$("from").value,to=$("to").value;
  $("res").textContent=new Intl.NumberFormat(loc(),{maximumFractionDigits:4}).format(a/r[f]*r[to])+" "+to;
  $("ratesHead").textContent=t("rate_for")+S.cur;var b=$("rates");b.textContent="";
  FIATS.filter(function(c){return c!==S.cur}).forEach(function(c){var row=el("div","coin");row.appendChild(el("b","sp","1 "+S.cur));row.appendChild(el("b","",new Intl.NumberFormat(loc(),{maximumFractionDigits:4}).format(r[c]/r[S.cur])+" "+c));b.appendChild(row)})
 }catch(e){$("res").textContent=t("err")}
}

/* ---------- погода и время ---------- */
async function geo(name){var d=await jget("https://geocoding-api.open-meteo.com/v1/search?count=1&language="+S.lang+"&name="+encodeURIComponent(name));return d.results&&d.results[0]}
function wmo(c){return c===0?"☀️":c<3?"🌤":c===3?"☁️":c<50?"🌫":c<60?"🌦":c<70||(c>=80&&c<83)?"🌧":c<80||c===85||c===86?"❄️":c>=95?"⛈":"🌡"}
async function loadWeather(name){
 var b=$("wout");if(!name){b.textContent="";return}
 try{var g=await geo(name);if(!g){b.textContent=t("nf");return}
  var w=await jget("https://api.open-meteo.com/v1/forecast?latitude="+g.latitude+"&longitude="+g.longitude+"&timezone=auto&forecast_days=5&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min");
  S.city=g.name;save();var c=w.current;b.textContent="";
  b.appendChild(el("div","muted",g.name+", "+(g.country||"")));
  b.appendChild(el("div","big",wmo(c.weather_code)+" "+Math.round(c.temperature_2m)+"°C"));
  b.appendChild(el("div","muted",t("feels")+" "+Math.round(c.apparent_temperature)+"° · "+t("hum")+" "+c.relative_humidity_2m+"% · "+t("wind")+" "+Math.round(c.wind_speed_10m)+" km/h"));
  w.daily.time.forEach(function(d,i){if(!i)return;var r=el("div","coin");r.style.cursor="default";
   r.appendChild(el("span","sp",new Date(d).toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short"})));
   r.appendChild(el("span","",wmo(w.daily.weather_code[i])+" "+Math.round(w.daily.temperature_2m_min[i])+"…"+Math.round(w.daily.temperature_2m_max[i])+"°"));b.appendChild(r)})
 }catch(e){b.textContent=t("err")}
}
function clocks(){return CLOCKS.map(function(c){return{n:c.n[S.lang],tz:c.tz}}).concat(S.clocks)}
function renderClocks(){
 var b=$("clocks");b.textContent="";
 clocks().forEach(function(c,i){var r=el("div","coin");r.style.cursor="default";
  var m=el("div","sp");m.appendChild(el("b","",c.n));var d=el("div","muted");d.dataset.d=c.tz;m.appendChild(d);r.appendChild(m);
  var tm=el("b","");tm.dataset.tz=c.tz;tm.style.fontSize="20px";r.appendChild(tm);
  if(i>=CLOCKS.length){var x=el("button","x","✕");x.onclick=function(){S.clocks.splice(i-CLOCKS.length,1);save();renderClocks()};r.appendChild(x)}
  b.appendChild(r)});tick()
}
function tick(){var n=new Date();
 document.querySelectorAll("[data-tz]").forEach(function(e){try{e.textContent=n.toLocaleTimeString(loc(),{timeZone:e.dataset.tz,hour:"2-digit",minute:"2-digit",second:"2-digit"})}catch(x){}});
 document.querySelectorAll("[data-d]").forEach(function(e){try{e.textContent=n.toLocaleDateString(loc(),{timeZone:e.dataset.d,weekday:"short",day:"numeric",month:"short"})}catch(x){}})
}
setInterval(tick,1000);

/* ---------- трекер и избранное ---------- */
function renderWatch(){
 var b=$("watch");b.textContent="";
 if(!S.watch.length){b.appendChild(el("div","muted",t("empty")));return}
 S.watch.forEach(function(s,i){var r=el("div","coin");r.appendChild(el("b","sp","★ "+s));
  var x=el("button","x","✕");x.onclick=function(e){e.stopPropagation();S.watch.splice(i,1);save();renderWatch();loadMarket()};r.appendChild(x);
  r.onclick=function(){openCoin(s)};b.appendChild(r)})
}
function sendAlert(){
 var sym=$("asym").value.trim().toUpperCase(),tg_=parseFloat($("atg").value);
 if(!sym||!(tg_>0)){toast(t("sym_ph"));return}
 if(!tg||!tg.platform||tg.platform==="unknown"){toast(t("sent"));return}
 try{tg.sendData(JSON.stringify({action:"alert",sym:sym,dir:$("adir").value,target:tg_,cur:$("acur").value}))}catch(e){}
 setTimeout(function(){toast(t("sent"))},900);
}

/* ---------- профиль ---------- */
function fillMe(){
 var n=user?((user.first_name||"")+" "+(user.last_name||"")).trim():t("guest");
 $("uname").textContent=n||t("guest");$("av").textContent=(n||"?").charAt(0).toUpperCase();
 $("uinfo").textContent=user?((user.username?"@"+user.username+" · ":"")+"ID "+user.id):"";
}

/* ---------- запуск ---------- */
function showTab(n){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on")});$("s-"+n).classList.add("on");
 document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.tab===n)});window.scrollTo(0,0);
 if(n==="market")loadMarket();if(n==="fx")loadFx();if(n==="track")renderWatch();if(n==="world"&&$("wout").textContent===""&&S.city)loadWeather(S.city)}
function refresh(){applyI18n();applyTheme();fillMe();renderClocks();renderWatch();$("cursel").value=S.cur;loadMarket();loadFx()}
function init(){
 if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.onEvent("themeChanged",applyTheme)}catch(e){}}
 fillSel("from","USD");fillSel("to",S.cur==="USD"?"EUR":S.cur);fillSel("cursel",S.cur);fillSel("acur","USD");
 document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){showTab(b.dataset.tab)}});
 $("qb").onclick=function(){openCoin($("q").value)};$("q").onkeydown=function(e){if(e.key==="Enter")openCoin($("q").value)};
 ["amt","from","to"].forEach(function(i){$(i).oninput=loadFx});
 $("swap").onclick=function(){var a=$("from").value;$("from").value=$("to").value;$("to").value=a;loadFx()};
 $("wseg").onclick=function(e){var w=e.target.dataset.w;if(!w)return;this.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b===e.target)});$("w-weather").style.display=w==="weather"?"":"none";$("w-time").style.display=w==="time"?"":"none"};
 $("cityb").onclick=function(){loadWeather($("city").value.trim())};$("city").onkeydown=function(e){if(e.key==="Enter")loadWeather(this.value.trim())};
 $("tcityb").onclick=async function(){var v=$("tcity").value.trim();if(!v)return;try{var g=await geo(v);if(!g||!g.timezone){toast(t("nf"));return}S.clocks.push({n:g.name,tz:g.timezone});save();$("tcity").value="";renderClocks()}catch(e){toast(t("err"))}};
 $("asend").onclick=sendAlert;
 $("lseg").onclick=function(e){if(e.target.dataset.l){S.lang=e.target.dataset.l;save();refresh()}};
 $("tseg").onclick=function(e){if(e.target.dataset.t){S.theme=e.target.dataset.t;save();applyI18n();applyTheme()}};
 $("cursel").onchange=function(){S.cur=this.value;save();$("to").value=S.cur==="USD"?"EUR":S.cur;loadMarket();loadFx()};
 $("close").onclick=function(){tg?tg.close():toast("Telegram only")};
 $("reset").onclick=function(){if(confirm(t("sure"))){try{localStorage.removeItem(KEY)}catch(e){}location.href=location.pathname}};
 $("dclose").onclick=function(){$("sheet").classList.remove("on")};
 $("sheet").onclick=function(e){if(e.target===this)this.classList.remove("on")};
 $("pseg").onclick=function(e){var p=e.target.dataset.p;if(!p)return;cur.per=p;this.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b===e.target)});loadChart()};
 $("dstar").onclick=function(){var i=S.watch.indexOf(cur.sym);i>=0?S.watch.splice(i,1):S.watch.push(cur.sym);save();starBtn();loadMarket();renderWatch()};
 $("dalert").onclick=function(){$("asym").value=cur.sym;$("sheet").classList.remove("on");showTab("track")};
 var cv=$("cv"),mv=function(e){if(!cur.pts.length)return;var r=cv.getBoundingClientRect(),i=Math.round((e.clientX-r.left)/r.width*(cur.pts.length-1));draw(Math.max(0,Math.min(cur.pts.length-1,i)))};
 cv.addEventListener("pointermove",mv);cv.addEventListener("pointerdown",mv);cv.addEventListener("pointerleave",function(){draw(-1)});
 refresh();
 var tab=qp.get("tab");if(tab&&$("s-"+tab))showTab(tab);
 var coin=qp.get("coin");if(coin)openCoin(coin);
}
init();
})();
</script>
</body>
</html>
