<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мини-приложение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #f3f5fb;
  --card: #ffffff;
  --text: #171a23;
  --muted: #7b8194;
  --line: #e8ebf3;
  --accent: #6c5ce7;
  --accent2: #8e7cf8;
  --accent-soft: rgba(108, 92, 231, .12);
  --ok: #22c08a;
  --danger: #ef5b6b;
  --shadow: 0 6px 24px rgba(30, 40, 90, .08);
}
:root[data-theme="dark"] {
  --bg: #0f1117;
  --card: #1a1d27;
  --text: #eef0f6;
  --muted: #8c93a8;
  --line: #272b38;
  --accent: #8b7bff;
  --accent2: #a89bff;
  --accent-soft: rgba(139, 123, 255, .16);
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overscroll-behavior: none;
}
button, input { font-family: inherit; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 18px 16px calc(100px + env(safe-area-inset-bottom));
}
.screen { display: none; animation: fade .25s ease; }
.screen.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Шапка ---------- */
.hero { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; font-weight: 700; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.big { width: 84px; height: 84px; font-size: 32px; margin: 0 auto 12px; }
.hello { font-size: 20px; font-weight: 700; line-height: 1.2; }
.date { color: var(--muted); font-size: 14px; margin-top: 3px; }

/* ---------- Карточки ---------- */
.card {
  background: var(--card);
  border-radius: 20px;
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

.progress { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .track { stroke: var(--accent-soft); }
.ring .bar {
  stroke: var(--accent); stroke-linecap: round;
  stroke-dasharray: 263.9; stroke-dashoffset: 263.9;
  transition: stroke-dashoffset .6s ease;
}
.ring-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 20px;
}
.p-title { font-size: 18px; font-weight: 700; }
.p-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--card); border-radius: 16px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12px; }

/* ---------- Поля и кнопки ---------- */
.add-row { display: flex; gap: 8px; }
.input {
  flex: 1; min-width: 0;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--text);
  border-radius: 14px; padding: 12px 14px; font-size: 16px; outline: none;
  transition: border-color .2s;
}
.input:focus { border-color: var(--accent); }
.input::placeholder { color: var(--muted); }

.btn {
  border: 0; cursor: pointer; font-weight: 600; font-size: 15px;
  border-radius: 14px; padding: 12px 18px; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  transition: transform .12s, opacity .2s;
}
.btn:active { transform: scale(.97); opacity: .9; }
.btn.block { display: block; width: 100%; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: rgba(239, 91, 107, .12); color: var(--danger); }
.btn + .btn { margin-top: 10px; }

/* ---------- Задачи ---------- */
.filters { display: flex; gap: 8px; margin-bottom: 12px; }
.chip {
  border: 0; cursor: pointer; padding: 8px 14px; border-radius: 999px;
  background: var(--card); color: var(--muted); font-size: 14px; font-weight: 600;
  box-shadow: var(--shadow);
}
.chip.active { background: var(--accent); color: #fff; }

#list { list-style: none; margin: 0; padding: 0; }
.task {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border-radius: 16px; padding: 12px 12px 12px 14px;
  margin-bottom: 8px; box-shadow: var(--shadow); animation: fade .25s ease;
}
.check {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
  border: 2px solid var(--line); background: transparent;
  display: flex; align-items: center; justify-content: center; padding: 0;
  transition: .2s;
}
.check svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.task.done .check { background: var(--ok); border-color: var(--ok); }
.task.done .check svg { opacity: 1; }
.t-text { flex: 1; min-width: 0; font-size: 16px; line-height: 1.3; word-break: break-word; cursor: pointer; }
.task.done .t-text { color: var(--muted); text-decoration: line-through; }
.del {
  border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer;
  width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
}
.del:active { background: rgba(239, 91, 107, .12); color: var(--danger); }
.empty { text-align: center; color: var(--muted); padding: 36px 10px; font-size: 15px; display: none; }
.empty .big { font-size: 40px; margin-bottom: 8px; }

/* ---------- Профиль ---------- */
.profile-head { text-align: center; }
.p-name { font-size: 22px; font-weight: 700; }
.p-user { color: var(--muted); font-size: 15px; margin-top: 2px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row:first-of-type { padding-top: 0; }
.row span:first-child { color: var(--muted); }
.row span:last-child { font-weight: 600; text-align: right; word-break: break-all; }

.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0 14px; font-size: 15px; font-weight: 600; }
.switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: var(--line); border-radius: 30px; cursor: pointer; transition: .25s; }
.slider::before {
  content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: .25s; box-shadow: 0 2px 6px rgba(0,0,0,.2);
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(20px); }
.seg { display: flex; background: var(--bg); border-radius: 14px; padding: 4px; margin-top: 8px; }
.seg button {
  flex: 1; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 14px;
  padding: 9px 4px; border-radius: 11px; cursor: pointer;
}
.seg button.active { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }

/* ---------- Нижнее меню ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 65%, transparent);
}
.tabs { display: flex; gap: 4px; width: 100%; max-width: 560px; background: var(--card); border-radius: 22px; padding: 6px; box-shadow: var(--shadow); }
.tab {
  flex: 1; border: 0; background: none; color: var(--muted); cursor: pointer;
  padding: 8px 4px; border-radius: 16px; font-size: 11px; font-weight: 500;
  display: flex; flex-direction: column; align-items: center; gap: 3px; transition: .2s;
}
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { color: var(--accent); background: var(--accent-soft); font-weight: 700; }

/* ---------- Уведомление ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: #222633; color: #fff; padding: 11px 18px; border-radius: 14px;
  font-size: 14px; max-width: 90%; text-align: center; transition: .25s; z-index: 10;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">

  <!-- ===== ГЛАВНАЯ ===== -->
  <main id="screen-home" class="screen active">
    <header class="hero">
      <div class="avatar" id="avatarHome"></div>
      <div>
        <div class="hello" id="hello">Привет!</div>
        <div class="date" id="date"></div>
      </div>
    </header>

    <section class="card progress">
      <div class="ring">
        <svg viewBox="0 0 100 100">
          <circle class="track" cx="50" cy="50" r="42"></circle>
          <circle class="bar" id="ringBar" cx="50" cy="50" r="42"></circle>
        </svg>
        <div class="ring-text" id="ringText">0%</div>
      </div>
      <div>
        <div class="p-title" id="pTitle">Пока нет задач</div>
        <div class="p-sub" id="pSub">Добавь первую задачу ниже</div>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Всего</span></div>
      <div class="stat"><b id="sDone">0</b><span>Готово</span></div>
      <div class="stat"><b id="sLeft">0</b><span>Осталось</span></div>
    </section>

    <section class="card">
      <h3>Быстрая задача</h3>
      <div class="add-row">
        <input class="input" id="quickInput" type="text" maxlength="200" placeholder="Что нужно сделать?">
        <button class="btn" id="quickBtn">Добавить</button>
      </div>
    </section>

    <button class="btn ghost block" id="sendBtn">📤 Отправить сводку боту</button>
  </main>

  <!-- ===== ЗАДАЧИ ===== -->
  <main id="screen-tasks" class="screen">
    <div class="card">
      <div class="add-row">
        <input class="input" id="taskInput" type="text" maxlength="200" placeholder="Новая задача">
        <button class="btn" id="taskBtn">+</button>
      </div>
    </div>

    <div class="filters">
      <button class="chip active" data-filter="all">Все</button>
      <button class="chip" data-filter="active">Активные</button>
      <button class="chip" data-filter="done">Готово</button>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty"><div class="big">📝</div><div id="emptyText">Здесь пока пусто</div></div>

    <button class="btn danger block" id="clearDone" style="margin-top:14px">Удалить выполненные</button>
  </main>

  <!-- ===== ПРОФИЛЬ ===== -->
  <main id="screen-profile" class="screen">
    <section class="card profile-head">
      <div class="avatar big" id="avatarProfile"></div>
      <div class="p-name" id="pName">Гость</div>
      <div class="p-user" id="pUser"></div>
    </section>

    <section class="card">
      <h3>Данные</h3>
      <div class="row"><span>ID</span><span id="infoId">—</span></div>
      <div class="row"><span>Язык</span><span id="infoLang">—</span></div>
      <div class="row"><span>Платформа</span><span id="infoPlatform">—</span></div>
      <div class="row"><span>Версия Telegram</span><span id="infoVersion">—</span></div>
    </section>

    <section class="card">
      <h3>Настройки</h3>
      <div class="setting">
        <span>Вибрация при действиях</span>
        <label class="switch"><input type="checkbox" id="hapticSwitch"><span class="slider"></span></label>
      </div>
      <div style="font-size:15px;font-weight:600">Тема</div>
      <div class="seg" id="themeSeg">
        <button data-theme="auto">Авто</button>
        <button data-theme="light">Светлая</button>
        <button data-theme="dark">Тёмная</button>
      </div>
    </section>

    <button class="btn ghost block" id="closeBtn">Закрыть приложение</button>
    <button class="btn danger block" id="resetBtn">Сбросить все данные</button>
  </main>

</div>

<div class="toast" id="toast"></div>

<nav class="tabbar">
  <div class="tabs">
    <button class="tab active" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Главная
    </button>
    <button class="tab" data-tab="tasks">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Задачи
    </button>
    <button class="tab" data-tab="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Профиль
    </button>
  </div>
</nav>

<script>
(function () {
  "use strict";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  var CIRC = 263.9;
  var KEY = "tgapp_v1";
  var state = { tasks: [], haptics: true, theme: "auto" };
  var filter = "all";
  var toastTimer = null;

  function $(id) { return document.getElementById(id); }

  /* ---------- Хранилище (в памяти телефона/компьютера) ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (Array.isArray(d.tasks)) state.tasks = d.tasks;
        if (typeof d.haptics === "boolean") state.haptics = d.haptics;
        if (d.theme === "auto" || d.theme === "light" || d.theme === "dark") state.theme = d.theme;
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- Вспомогательное ---------- */
  function haptic(kind) {
    if (!state.haptics || !tg || !tg.HapticFeedback) return;
    try {
      if (kind === "ok") tg.HapticFeedback.notificationOccurred("success");
      else tg.HapticFeedback.impactOccurred("light");
    } catch (e) {}
  }

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }

  function plural(n) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return "задача";
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "задачи";
    return "задач";
  }

  function greeting() {
    var h = new Date().getHours();
    if (h < 5) return "Доброй ночи";
    if (h < 12) return "Доброе утро";
    if (h < 18) return "Добрый день";
    return "Добрый вечер";
  }

  function confirmBox(msg, cb) {
    if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2") && tg.showConfirm) {
      tg.showConfirm(msg, function (ok) { if (ok) cb(); });
    } else if (window.confirm(msg)) {
      cb();
    }
  }

  /* ---------- Тема ---------- */
  function applyTheme() {
    var mode = state.theme;
    if (mode === "auto") {
      if (tg && tg.colorScheme) mode = tg.colorScheme;
      else mode = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", mode);
    var bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try {
      if (tg) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); }
    } catch (e) {}
    var btns = document.querySelectorAll("#themeSeg button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle("active", btns[i].getAttribute("data-theme") === state.theme);
    }
  }

  /* ---------- Пользователь ---------- */
  var user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;

  // Если приложение открыто кнопкой клавиатуры, Telegram не передаёт данные аккаунта.
  // В этом случае бот кладёт их в адрес (?id=...&fn=...), и мы берём их оттуда.
  if (!user) {
    try {
      var qp = new URLSearchParams(window.location.search);
      var uid = qp.get("id");
      if (uid && /^[0-9]{1,15}$/.test(uid)) {
        user = {
          id: Number(uid),
          first_name: (qp.get("fn") || "").slice(0, 64),
          last_name: (qp.get("ln") || "").slice(0, 64),
          username: (qp.get("un") || "").slice(0, 64),
          language_code: (qp.get("lang") || "").slice(0, 10)
        };
      }
    } catch (e) {}
  }

  function fillAvatar(el) {
    el.textContent = "";
    var name = user ? (user.first_name || "?") : "Г";
    var initial = name.charAt(0).toUpperCase();
    if (user && user.photo_url) {
      var img = document.createElement("img");
      img.alt = "";
      img.src = user.photo_url;
      img.onerror = function () { el.textContent = initial; };
      el.appendChild(img);
    } else {
      el.textContent = initial;
    }
  }

  function fillUser() {
    var first = user ? (user.first_name || "друг") : "гость";
    $("hello").textContent = greeting() + ", " + first + "!";
    var d = new Date().toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
    $("date").textContent = d.charAt(0).toUpperCase() + d.slice(1);

    fillAvatar($("avatarHome"));
    fillAvatar($("avatarProfile"));

    var full = user ? ((user.first_name || "") + " " + (user.last_name || "")).trim() : "Гость";
    $("pName").textContent = full || "Без имени";
    $("pUser").textContent = (user && user.username) ? "@" + user.username : "";
    $("infoId").textContent = user ? String(user.id) : "—";
    $("infoLang").textContent = (user && user.language_code) ? user.language_code.toUpperCase() : "—";
    $("infoPlatform").textContent = tg && tg.platform ? tg.platform : "браузер";
    $("infoVersion").textContent = tg && tg.version ? tg.version : "—";
  }

  /* ---------- Задачи ---------- */
  function addTask(text) {
    text = (text || "").trim();
    if (!text) { toast("Введите текст задачи"); return false; }
    if (state.tasks.length >= 100) { toast("Максимум 100 задач"); return false; }
    state.tasks.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      text: text.slice(0, 200),
      done: false
    });
    save(); render(); haptic("ok");
    return true;
  }

  function toggleTask(id) {
    for (var i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i].id === id) { state.tasks[i].done = !state.tasks[i].done; break; }
    }
    save(); render(); haptic("light");
  }

  function removeTask(id) {
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    save(); render(); haptic("light");
  }

  function render() {
    var total = state.tasks.length;
    var done = state.tasks.filter(function (t) { return t.done; }).length;
    var left = total - done;
    var pct = total ? Math.round(done / total * 100) : 0;

    $("ringText").textContent = pct + "%";
    $("ringBar").style.strokeDashoffset = (CIRC * (1 - pct / 100)).toFixed(1);
    $("sTotal").textContent = total;
    $("sDone").textContent = done;
    $("sLeft").textContent = left;

    if (!total) {
      $("pTitle").textContent = "Пока нет задач";
      $("pSub").textContent = "Добавь первую задачу ниже";
    } else if (left === 0) {
      $("pTitle").textContent = "Всё выполнено! 🎉";
      $("pSub").textContent = "Выполнено " + done + " из " + total;
    } else {
      $("pTitle").textContent = "Осталось " + left + " " + plural(left);
      $("pSub").textContent = "Выполнено " + done + " из " + total;
    }

    var list = $("list");
    list.textContent = "";
    var items = state.tasks.filter(function (t) {
      return filter === "all" || (filter === "active" && !t.done) || (filter === "done" && t.done);
    });

    items.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "task" + (t.done ? " done" : "");

      var check = document.createElement("button");
      check.className = "check";
      check.setAttribute("aria-label", "Отметить выполненной");
      check.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
      check.onclick = function () { toggleTask(t.id); };

      var span = document.createElement("span");
      span.className = "t-text";
      span.textContent = t.text;
      span.onclick = function () { toggleTask(t.id); };

      var del = document.createElement("button");
      del.className = "del";
      del.setAttribute("aria-label", "Удалить");
      del.textContent = "✕";
      del.onclick = function () { removeTask(t.id); };

      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(del);
      list.appendChild(li);
    });

    var empty = $("empty");
    empty.style.display = items.length ? "none" : "block";
    $("emptyText").textContent = total ? "В этом списке ничего нет" : "Здесь пока пусто. Добавь первую задачу!";
    $("clearDone").style.display = done ? "block" : "none";
  }

  /* ---------- Вкладки ---------- */
  function showTab(name) {
    var screens = document.querySelectorAll(".screen");
    for (var i = 0; i < screens.length; i++) screens[i].classList.remove("active");
    $("screen-" + name).classList.add("active");
    var tabs = document.querySelectorAll(".tab");
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].classList.toggle("active", tabs[j].getAttribute("data-tab") === name);
    }
    window.scrollTo(0, 0);
    haptic("light");
  }

  /* ---------- Подключение кнопок ---------- */
  function bindAdd(inputId, btnId) {
    var input = $(inputId);
    function go() { if (addTask(input.value)) input.value = ""; }
    $(btnId).onclick = go;
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
  }

  function init() {
    load();

    if (tg) {
      try { tg.ready(); } catch (e) {}
      try { tg.expand(); } catch (e) {}
      try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
      try { tg.onEvent("themeChanged", applyTheme); } catch (e) {}
    }

    applyTheme();
    fillUser();

    bindAdd("quickInput", "quickBtn");
    bindAdd("taskInput", "taskBtn");

    var tabs = document.querySelectorAll(".tab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].onclick = (function (el) {
        return function () { showTab(el.getAttribute("data-tab")); };
      })(tabs[i]);
    }

    var chips = document.querySelectorAll(".chip");
    for (var j = 0; j < chips.length; j++) {
      chips[j].onclick = (function (el) {
        return function () {
          filter = el.getAttribute("data-filter");
          for (var k = 0; k < chips.length; k++) chips[k].classList.toggle("active", chips[k] === el);
          render();
        };
      })(chips[j]);
    }

    $("clearDone").onclick = function () {
      confirmBox("Удалить все выполненные задачи?", function () {
        state.tasks = state.tasks.filter(function (t) { return !t.done; });
        save(); render(); toast("Выполненные задачи удалены");
      });
    };

    var hs = $("hapticSwitch");
    hs.checked = state.haptics;
    hs.onchange = function () { state.haptics = hs.checked; save(); haptic("light"); };

    var themeBtns = document.querySelectorAll("#themeSeg button");
    for (var m = 0; m < themeBtns.length; m++) {
      themeBtns[m].onclick = (function (el) {
        return function () { state.theme = el.getAttribute("data-theme"); save(); applyTheme(); };
      })(themeBtns[m]);
    }

    $("closeBtn").onclick = function () {
      if (tg) tg.close(); else toast("Закрыть можно только в Telegram");
    };

    $("resetBtn").onclick = function () {
      confirmBox("Удалить все задачи и настройки?", function () {
        state = { tasks: [], haptics: true, theme: "auto" };
        save(); hs.checked = true; applyTheme(); render(); toast("Данные сброшены");
      });
    };

    $("sendBtn").onclick = function () {
      if (!tg || !tg.platform || tg.platform === "unknown") { toast("Откройте приложение в Telegram"); return; }
      var open = state.tasks.filter(function (t) { return !t.done; })
        .slice(0, 10).map(function (t) { return t.text.slice(0, 50); });
      var payload = JSON.stringify({
        action: "report",
        total: state.tasks.length,
        done: state.tasks.filter(function (t) { return t.done; }).length,
        open: open
      });
      try { tg.sendData(payload); } catch (e) {}
      // Если приложение не закрылось, значит отправка не сработала
      setTimeout(function () {
        toast("Не получилось. Откройте приложение кнопкой «🚀 Открыть приложение» в чате с ботом");
      }, 900);
    };

    render();
  }

  init();
})();
</script>
</body>
</html>
